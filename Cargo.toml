[package]
name = "hepcat"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A Voicemeeter-style audio mixer for PipeWire with a native KDE Plasma look"
license = "MIT"
repository = "https://github.com/arczimboldo/hepcat"

[dependencies]
anyhow = "1.0.104"
cxx = "1.0.205"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
dirs = "7.0.0"
nnnoiseless = { version = "0.5.2", default-features = false }
pipewire = { version = "0.10", features = ["v0_3_49"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"

[build-dependencies]
cc = "1.8"
cxx-qt-build = "0.10"
pkg-config = "0.3.34"
