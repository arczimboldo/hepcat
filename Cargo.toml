[package]
name = "hepcat"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
cxx = "1.0.205"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
dirs = "7.0.0"
pipewire = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"

[build-dependencies]
cxx-qt-build = "0.10"
