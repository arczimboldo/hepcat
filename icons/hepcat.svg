<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#shine)"/>

  <!-- Whiskers -->
  <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
    <path d="M28 92 L10 88"/>
    <path d="M28 99 L12 103"/>
    <path d="M100 92 L118 88"/>
    <path d="M100 99 L116 103"/>
  </g>

  <!-- Head and ears -->
  <g fill="#fbf8ff" stroke="#fbf8ff" stroke-width="6" stroke-linejoin="round">
    <path d="M27 64 L32 17 L61 46 Z"/>
    <path d="M101 64 L96 17 L67 46 Z"/>
    <ellipse cx="64" cy="79" rx="41" ry="32"/>
  </g>

  <!-- Faders in the ears: a track and a handle, set to different levels -->
  <g stroke="#d9cdf7" stroke-width="4" stroke-linecap="round">
    <path d="M36 28 L42 53"/>
    <path d="M92 28 L86 53"/>
  </g>
  <g fill="#3b1d7a">
    <rect x="31" y="31" width="15" height="7" rx="2" transform="rotate(-13.5 38.5 34.5)"/>
    <rect x="81.5" y="41.5" width="15" height="7" rx="2" transform="rotate(13.5 89 45)"/>
  </g>
  <g stroke="#ffffff" stroke-width="1.2" opacity="0.6">
    <path d="M33.5 34.2 L43.5 31.8" transform="rotate(0)"/>
    <path d="M84.5 43.6 L94 45.9"/>
  </g>

  <!-- Shades -->
  <g fill="#1c1030">
    <rect x="30" y="64" width="29" height="19" rx="8.5"/>
    <rect x="69" y="64" width="29" height="19" rx="8.5"/>
    <rect x="55" y="67" width="18" height="5" rx="2"/>
  </g>
  <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.55">
    <path d="M36 70 L42 70"/>
    <path d="M75 70 L81 70"/>
  </g>

  <!-- Nose and grin -->
  <path d="M59 89 L69 89 L64 95 Z" fill="#ec4899" stroke="#ec4899" stroke-width="2" stroke-linejoin="round"/>
  <path d="M55 98 Q59.5 104 64 98 Q68.5 104 73 98" fill="none" stroke="#3b1d7a" stroke-width="2.5" stroke-linecap="round"/>
</svg>
